<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelCraft - Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- BARRA SUPERIOR DE PIXELCRAFT -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/80 px-4 flex justify-between items-center z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/20">
        P
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-slate-100">PixelCraft <span class="text-[10px] text-pink-400 font-normal">Studio</span></h1>
      </div>
    </div>

    <!-- Herramientas Rápidas -->
    <div class="flex items-center gap-2">
      <button onclick="addElement('text')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg transition flex items-center gap-1.5">
        <i data-lucide="type" class="w-3.5 h-3.5 text-indigo-400"></i> Texto
      </button>
      <button onclick="addElement('shape')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg transition flex items-center gap-1.5">
        <i data-lucide="square" class="w-3.5 h-3.5 text-pink-400"></i> Figura
      </button>
      <button onclick="exportCanvas()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5">
        <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar
      </button>
    </div>
  </header>

  <!-- ÁREA DE TRABAJO (WORKSPACE) -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Panel Lateral de Capas y Elementos -->
    <aside class="w-64 border-r border-slate-800 bg-slate-900/40 p-4 flex flex-col gap-4 hidden md:flex">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Capas del Diseño</h3>
      <div id="layers-list" class="flex-1 space-y-2 overflow-y-auto">
        <!-- Las capas se generan aquí -->
      </div>
    </aside>

    <!-- Lienzo Central (Canvas Workspace) -->
    <main class="flex-1 bg-slate-950 flex items-center justify-center p-6 relative overflow-auto">
      <div id="canvas-board" class="w-[600px] h-[400px] bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl relative overflow-hidden">
        <!-- Elementos interactivos dentro del lienzo -->
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
